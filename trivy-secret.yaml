# Ausnahmen für die Secret-Suche von Trivy. Echte Geheimnisse gehören nie ins Repository.
allow-rules:
  - id: zertifikats-testdaten
    description: >-
      Private Testschlüssel der Zertifikats-Tools, mit OpenSSL nur für die Tests erzeugt; sie
      schützen nichts. Die Tests für PFX und APC-.p15 brauchen genau diese Schlüssel.
    path: frontend/src/tools/cert-decode/(pfx|apc)-fixtures\.ts$
