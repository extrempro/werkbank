# cooldown: neue Versionen erst nach 7 Tagen vorschlagen (Schutz vor kompromittierten Releases)
# groups: Updates gesammelt, damit nicht für jedes Paket ein eigener PR entsteht
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # Python: Dependabot hält uv.lock aktuell (feste Versionen mit Hashes)
  - package-ecosystem: "uv"
    directory: "/backend"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Kleinere Python-Updates gesammelt in einem PR pro Woche, Hauptversionen einzeln zur Prüfung
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    ignore:
      # Node-Typen passend zur verwendeten Node-Version (22) halten
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Hauptversionen von TypeScript nur bewusst und zusammen mit typescript-eslint
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Kleinere Updates gesammelt in einem PR, Hauptversionen einzeln zur Prüfung
      frontend-klein:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/e2e"
    ignore:
      # Node-Typen passend zur verwendeten Node-Version (22) halten
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Hauptversionen von TypeScript nur bewusst und zusammen mit typescript-eslint
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      e2e-klein:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/backend"
    ignore:
      # Node-Image: nur LTS-Versionen, Hauptversionen bewusst anheben (keine ungeraden Versionen)
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Python-Image: Hauptversionen bewusst und zusammen mit requires-python und uv.lock anheben
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/deploy"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(docker)"

  # Docker in /powershell: Eintrag ergänzen, sobald der PowerShell-Container existiert
  # (bis dahin würde Dependabot jede Woche mit "No Dockerfiles found" fehlschlagen)

  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(docker)"
