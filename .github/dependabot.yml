# cooldown: neue Versionen erst nach 7 Tagen vorschlagen (Schutz vor kompromittierten Releases)
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "pip"
    directory: "/backend"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    ignore:
      # Node-Typen passend zur verwendeten Node-Version (22) halten
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Hauptversionen von TypeScript nur bewusst und zusammen mit typescript-eslint
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/e2e"
    ignore:
      # Node-Typen passend zur verwendeten Node-Version (22) halten
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Hauptversionen von TypeScript nur bewusst und zusammen mit typescript-eslint
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/backend"
    ignore:
      # Node-Image: nur LTS-Versionen, Hauptversionen bewusst anheben (keine ungeraden Versionen)
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Python-Image: Hauptversionen bewusst und zusammen mit requires-python anheben
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/powershell"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(docker)"
