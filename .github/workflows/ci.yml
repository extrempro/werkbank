# Prüfungen bei jedem Push auf einen Branch und bei jedem Pull Request.
# Jobs für Backend, Frontend, E2E und Docker laufen erst, wenn die jeweiligen
# Projektdateien existieren (ab Phase 1). Bis dahin werden sie übersprungen.
# Die Erkennung läuft im Job "detect" (Dateiprüfung nach dem Checkout).
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Projektteile erkennen
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      frontend: ${{ steps.d.outputs.frontend }}
      docker: ${{ steps.d.outputs.docker }}
      e2e: ${{ steps.d.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        run: |
          f() { [ -f "$1" ] && echo true || echo false; }
          echo "backend=$(f backend/pyproject.toml)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(f frontend/package.json)" >> "$GITHUB_OUTPUT"
          if [ -f deploy/docker-compose.yml ] && [ -f backend/Dockerfile ]; then echo docker=true; else echo docker=false; fi >> "$GITHUB_OUTPUT"
          echo "e2e=$(f e2e/package.json)" >> "$GITHUB_OUTPUT"

  docs:
    name: Dokumentation vorhanden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pflichtdokumente prüfen
        run: |
          for f in README.md LICENSE CLAUDE.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md CHANGELOG.md docs/spec.md; do
            test -s "$f" || { echo "Fehlt oder leer: $f"; exit 1; }
          done

  backend:
    name: Backend (Lint, Typen, Tests)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: werkbank_test
          POSTGRES_USER: werkbank
          POSTGRES_PASSWORD: nur-fuer-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U werkbank -d werkbank_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://werkbank:nur-fuer-ci@127.0.0.1:5432/werkbank_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: pytest --maxfail=1
      - name: Abhängigkeits-Audit
        run: pip install pip-audit && pip-audit

  frontend:
    name: Frontend (Lint, Typen, Tests, Build)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Abhängigkeits-Audit
        run: npm audit --audit-level=high

  docker:
    name: Docker-Deployment (Build, Start, Smoke-Test)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.docker == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test-Umgebung vorbereiten
        run: |
          cp deploy/.env.example deploy/.env
          mkdir -p deploy/secrets
          openssl rand -hex 24 > deploy/secrets/postgres_password
          chmod 444 deploy/secrets/postgres_password
      - name: Images bauen und starten
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build --wait
      - name: Smoke-Test
        run: |
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/health/ready
      - name: Worker läuft und hat aufgeräumt
        run: |
          docker compose -f deploy/docker-compose.yml ps worker
          for i in $(seq 1 30); do
            if docker compose -f deploy/docker-compose.yml exec -T db sh -c \
              'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select count(*) from jobs where finished_at is not null and error is null"' \
              | grep -qx '[1-9][0-9]*'; then
              echo "Aufräum-Auftrag erledigt"; exit 0
            fi
            sleep 2
          done
          echo "Kein erledigter Aufräum-Auftrag gefunden"; exit 1
      - name: Logs bei Fehler
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - name: Aufräumen
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  e2e:
    name: E2E, Barrierefreiheit, Lighthouse
    runs-on: ubuntu-latest
    needs: [detect, docker]
    if: needs.detect.outputs.e2e == 'true' && needs.detect.outputs.docker == 'true'
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - name: Abhängigkeits-Audit (Testwerkzeuge)
        run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: App für Tests starten (Test-Login, localhost)
        working-directory: .
        run: |
          cp deploy/.env.example deploy/.env
          sed -i \
            -e 's#^PUBLIC_URL=.*#PUBLIC_URL=http://localhost:8080#' \
            -e 's#^ENVIRONMENT=.*#ENVIRONMENT=test#' \
            -e 's#^ENABLE_TEST_LOGIN=.*#ENABLE_TEST_LOGIN=true#' \
            -e 's#^TRUSTED_PROXY_IPS=.*#TRUSTED_PROXY_IPS=127.0.0.1#' \
            -e 's#^RATE_LIMIT_LOGIN_PER_MINUTE=.*#RATE_LIMIT_LOGIN_PER_MINUTE=100000#' \
            -e 's#^RATE_LIMIT_API_PER_MINUTE=.*#RATE_LIMIT_API_PER_MINUTE=100000#' \
            deploy/.env
          mkdir -p deploy/secrets
          openssl rand -hex 24 > deploy/secrets/postgres_password
          chmod 444 deploy/secrets/postgres_password
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build --wait
      - name: Playwright (Desktop, Tablet, iPhone, inkl. axe-core)
        run: npx playwright test
      - name: Lighthouse CI
        run: npx lhci autorun
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-berichte
          path: |
            e2e/playwright-report
            .lighthouseci
          retention-days: 14
