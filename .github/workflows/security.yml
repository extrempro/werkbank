# Sicherheitsprüfungen bei jedem Pull Request und wöchentlich (Montag 05:00 UTC).
# Deckt den regelmäßigen Prüfauftrag ab: XSS (Semgrep), Secrets (Betterleaks),
# Abhängigkeiten und Container (Trivy). Service-Worker-Updates prüft der E2E-Job.
#
# Trivy ist auf Version und Digest festgelegt: Im März 2026 wurden unter bekannten Tags
# manipulierte Trivy-Images verteilt (CVE-2026-33634). Update nur nach Prüfung des neuen
# Releases (mindestens 7 Tage alt), Tag und Digest gemeinsam ändern.
name: Sicherheit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Betterleaks (MIT) ersetzt gitleaks: gitleaks wird nicht mehr weiterentwickelt, Betterleaks
  # kommt vom selben Autor und liest dieselbe Konfiguration. Release 1.10.1 vom 06.11.2026.
  # Ohne Digest festgelegt (Tag); Update von Hand, Dependabot erfasst Images in `run` nicht.
  BETTERLEAKS_IMAGE: ghcr.io/betterleaks/betterleaks:v1.10.1
  # Release 0.76.1 vom 21.10.2026, Digest des Images bei Docker Hub
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  semgrep:
    name: Semgrep (statische Analyse, XSS)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep
        run: >
          semgrep scan
          --config p/owasp-top-ten
          --config p/xss
          --config p/python
          --config p/typescript
          --config p/dockerfile
          --metrics=off
          --error

  betterleaks:
    name: Betterleaks (Secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Betterleaks
        # Ganze Historie aller Branches; Ausnahmen in .betterleaks.toml. Keine Prüfung gegen die
        # Anbieter (--validation bleibt aus), damit kein Fund das Repository verlässt.
        run: >
          docker run --rm -v "$PWD:/repo" "$BETTERLEAKS_IMAGE"
          git /repo --config /repo/.betterleaks.toml --log-opts="--all"
          --redact --verbose

  trivy:
    name: Trivy (Abhängigkeiten, Konfiguration, Secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy Dateisystem-Scan
        run: >
          docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE"
          fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL
          --secret-config /repo/trivy-secret.yaml
          --ignorefile /repo/.trivyignore
          --exit-code 1 /repo

  trivy-image:
    name: Trivy (Docker-Image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image bauen
        run: docker build -f backend/Dockerfile -t werkbank:scan .
      - name: Image als Datei
        # Trivy liest das Image aus der Datei und braucht so keinen Zugriff auf den Docker-Socket.
        run: docker save werkbank:scan -o werkbank-image.tar
      - name: Trivy Image-Scan
        # Bricht nur bei HIGH und CRITICAL ab, für die es schon ein Update gibt. Begründete
        # Ausnahmen stehen in .trivyignore.
        run: >
          docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE"
          image --input /repo/werkbank-image.tar
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --ignorefile /repo/.trivyignore
          --exit-code 1
