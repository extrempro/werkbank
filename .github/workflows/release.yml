# Veröffentlicht ein GitHub Release mit Tag vX.Y.Z.
#
# Auslöser:
# - Push auf main (also das Mergen eines PRs): Ist die Version in frontend/package.json neu,
#   gibt es also noch kein Release dazu, und hat CHANGELOG.md einen Abschnitt für diese Version,
#   legt der Workflow Tag und Release auf dem gemergten Commit an. Sonst passiert nichts.
# - Push eines Tags vX.Y.Z von Hand: Release für diesen Tag, falls es noch keins gibt.
# - Manuell über „Run workflow“: wie ein Push auf main.
#
# Die Release Notes kommen aus dem passenden Abschnitt in CHANGELOG.md.
#
# Zu jedem Release gehört ein Image in der GitHub-Registry: ghcr.io/<repo>:X.Y.Z, bei einem
# Lauf auf main zusätzlich :latest. Fehlt das Image zu einem vorhandenen Release (z. B. nach
# einem abgebrochenen Lauf), holt ein erneuter Lauf es nach.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version ermitteln und prüfen
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r .version frontend/package.json)"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Ungültige Version: $VERSION"
            exit 1
          fi

          # Alle Stellen mit der Version müssen übereinstimmen.
          E2E="$(jq -r .version e2e/package.json)"
          PY="$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/pyproject.toml | head -n 1)"
          INIT="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/werkbank/__init__.py)"
          for pair in "e2e/package.json:$E2E" "backend/pyproject.toml:$PY" "backend/werkbank/__init__.py:$INIT"; do
            if [ "${pair#*:}" != "$VERSION" ]; then
              echo "::error::${pair%%:*} hat Version ${pair#*:}, erwartet $VERSION"
              exit 1
            fi
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prüfen, ob es das Release schon gibt
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG gibt es schon, nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release Notes aus CHANGELOG.md lesen
        id: notes
        if: steps.exists.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ] && grep -q '[^[:space:]]' release-notes.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::Kein Abschnitt für Version $VERSION in CHANGELOG.md gefunden."
            exit 1
          else
            echo "Kein Abschnitt für Version $VERSION in CHANGELOG.md, kein Release."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag und GitHub Release erstellen
        if: steps.exists.outputs.skip == 'false' && steps.notes.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Werkbank $TAG" \
            --notes-file release-notes.md

      - name: Image bauen und in die GitHub-Registry legen
        if: steps.exists.outputs.skip == 'true' || steps.notes.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "Image $IMAGE:$VERSION gibt es schon, nichts zu tun."
            exit 0
          fi
          docker build -f backend/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=MIT" \
            -t "$IMAGE:$VERSION" .
          # Das Image muss die Version tragen, für die es veröffentlicht wird.
          test "$(docker run --rm "$IMAGE:$VERSION" python -c 'import werkbank; print(werkbank.__version__)')" = "$VERSION"
          docker push "$IMAGE:$VERSION"
          # latest nur von main aus bewegen, nicht bei einem nachträglich gesetzten Tag.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
