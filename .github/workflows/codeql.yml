# CodeQL-Analyse (GitHub Code Scanning, kostenlos für öffentliche Repositorys).
# Hinweis: In den Repository-Einstellungen das "Default setup" für CodeQL NICHT aktivieren,
# da diese Datei das "Advanced setup" ist.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Sprachen erkennen
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          langs=()
          if git ls-files '*.py' | grep -q .; then langs+=('"python"'); fi
          if git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' | grep -q .; then langs+=('"javascript-typescript"'); fi
          if [ ${#langs[@]} -eq 0 ]; then
            echo 'languages=[]' >> "$GITHUB_OUTPUT"; echo 'any=false' >> "$GITHUB_OUTPUT"
          else
            echo "languages=[$(IFS=,; echo "${langs[*]}")]" >> "$GITHUB_OUTPUT"; echo 'any=true' >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
