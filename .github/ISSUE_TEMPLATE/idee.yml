name: Idee oder Wunsch
description: Vorschlag für eine neue Funktion oder Verbesserung.
labels: ["idee"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: vorschlag
    attributes:
      label: Vorschlag
  - type: dropdown
    id: modul
    attributes:
      label: Bereich
      options: [Kern, M365-Konfiguration, Evergreen, neues Modul, Dokumentation]
