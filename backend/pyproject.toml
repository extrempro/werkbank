[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "werkbank"
version = "0.87.0"
description = "Werkbank - Open-Source-Plattform für IT-Abteilungen"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.7",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.9",
    "msal>=1.39.0",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
]

# Abhängigkeiten sind in uv.lock festgeschrieben (mit Hashes); Docker und CI installieren nur
# von dort. Neu erzeugen: siehe docs/repo-setup.md („Python-Abhängigkeiten“).

[tool.setuptools.packages.find]
include = ["werkbank*"]

[tool.setuptools.package-data]
werkbank = ["**/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["werkbank", "tests"]

[[tool.mypy.overrides]]
module = ["msal", "msal.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: Test braucht eine PostgreSQL-Datenbank (DATABASE_URL)"]

[tool.uv]
# Nur Versionen, die mindestens 7 Tage alt sind (wie die Wartezeit bei Dependabot)
exclude-newer = "7 days"
