# Werkbank – Docker Compose
# Konfiguration: deploy/.env (Vorlage: deploy/.env.example)
# Secrets: Ordner WERKBANK_SECRETS_DIR auf dem Host (nicht im Repository), siehe deploy/README.md
# Web-Dienst (API und Oberfläche), Worker (Hintergrundaufträge) und Datenbank. PowerShell folgt.

name: werkbank

# Das Image kommt fertig gebaut aus der GitHub-Registry; hier wird nichts gebaut und es muss
# kein Quellcode daneben liegen. Eine neue Version holt man mit "docker compose pull" und
# "docker compose up -d" (oder mit der entsprechenden Funktion des Verwaltungswerkzeugs).
# Feste Version statt der neuesten: WERKBANK_IMAGE=ghcr.io/extrempro/werkbank:0.17.1
# Aus einem ausgecheckten Repository bauen: zusätzlich docker-compose.build.yml angeben.
x-werkbank-image: &werkbank-image ${WERKBANK_IMAGE:-ghcr.io/extrempro/werkbank:latest}

services:
  web:
    image: *werkbank-image
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - source: entra_client_key
        target: entra_client_key.pem
      - source: entra_client_cert
        target: entra_client_cert.pem
      # Personensuche im IT-Bestand (Stellen, Verleih) liest Entra über die Collector-App
      - source: collector_client_key
        target: collector_client_key.pem
      - source: collector_client_cert
        target: collector_client_cert.pem
      - settings_key
    ports:
      - "${BIND_IP:-127.0.0.1}:${BIND_PORT:-8080}:8000"
    volumes:
      # PDF-Belege des IT-Budgets; gehört in die Sicherung
      - belege:/data/belege
    depends_on:
      db:
        condition: service_healthy
    networks:
      - intern
      - extern
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    # Gleiches Image wie web, anderer Startbefehl. Kein Port nach außen.
    image: *werkbank-image
    command: ["python", "-m", "werkbank.worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - source: collector_client_key
        target: collector_client_key.pem
      - source: collector_client_cert
        target: collector_client_cert.pem
      - settings_key
    depends_on:
      # web spielt beim Start die Datenbank-Migrationen ein
      web:
        condition: service_healthy
    networks:
      - intern
      - extern
    healthcheck:
      test: ["CMD", "python", "-m", "werkbank.worker", "--check"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-werkbank}
      POSTGRES_USER: ${POSTGRES_USER:-werkbank}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - intern
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

networks:
  # Datenbank nur intern erreichbar, kein Zugang nach außen
  intern:
    internal: true
  extern: {}

volumes:
  db-data:
  belege:

# Alle Dateien müssen vorhanden sein, sonst startet Compose nicht (siehe deploy/README.md).
# WERKBANK_SECRETS_DIR: Ordner auf dem Docker-Host, am besten ein absoluter Pfad außerhalb
# des Projektordners, damit ein Git-Sync die Dateien nicht anfasst.
secrets:
  postgres_password:
    file: ${WERKBANK_SECRETS_DIR:-./secrets}/postgres_password
  entra_client_key:
    file: ${WERKBANK_SECRETS_DIR:-./secrets}/entra_client_key.pem
  entra_client_cert:
    file: ${WERKBANK_SECRETS_DIR:-./secrets}/entra_client_cert.pem
  collector_client_key:
    file: ${WERKBANK_SECRETS_DIR:-./secrets}/collector_client_key.pem
  collector_client_cert:
    file: ${WERKBANK_SECRETS_DIR:-./secrets}/collector_client_cert.pem
  # Schlüssel für geheime Werte aus der Verwaltung (z. B. SMTP-Passwort)
  settings_key:
    file: ${WERKBANK_SECRETS_DIR:-./secrets}/settings_key
